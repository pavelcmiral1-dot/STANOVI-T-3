<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přehrávač – MC Gey: Osmimílový boty (Audio)</title>
  <style>
    :root {
      --bg: #0f172a; --card: #111827; --text: #e5e7eb; --muted: #9ca3af;
      --accent: #60a5fa; --accent-2: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh;
      background: radial-gradient(1200px 800px at 20% -10%, #1f2937 0%, var(--bg) 60%), var(--bg);
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial;
      display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(700px, 96vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 24px; backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    h1 { font-size: clamp(20px, 2.8vw, 26px); margin: 0 0 6px; }
    p.sub { color: var(--muted); margin: 0 0 16px; }
    .controls { display: flex; flex-direction: column; gap: 12px; }
    .buttons { display: flex; gap: 10px; align-items: center; }
    button {
      padding: 10px 14px; font-size: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, var(--accent), var(--accent-2)); color: white; cursor: pointer;
    }
    button.secondary { background: linear-gradient(180deg, #0b1220, #0a1020); color: var(--text); }
    button:active { transform: translateY(1px); }
    input[type=range] {
      width: 100%; height: 6px; border-radius: 999px; background: #0b1220;
      outline: none; appearance: none; -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: 1px solid rgba(255,255,255,0.6);
    }
    .time { text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>MC Gey – Osmimílový boty</h1>
    <p class="sub">Audio přehrávač · Kontrola: mezerník = přehrát/pozastavit · S = stop · ←/→ = posun −/+5s</p>

    <audio id="audio" preload="metadata">
      <source src="MC GEY - Osmimílový boty 720p.mp4" type="audio/mp4" />
      Váš prohlížeč nepodporuje HTML5 audio.
    </audio>

    <div class="controls">
      <div class="buttons">
        <button id="play">▶︎ Přehrát</button>
        <button id="stop" class="secondary">⏹︎ Stop</button>
        <button id="back5" class="secondary">⟲ 5s</button>
        <button id="fwd5" class="secondary">5s ⟳</button>
      </div>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1">
      <div class="time" id="clock">00:00 / 00:00</div>
    </div>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('play');
    const btnStop = document.getElementById('stop');
    const seek = document.getElementById('seek');
    const clock = document.getElementById('clock');
    const back5 = document.getElementById('back5');
    const fwd5 = document.getElementById('fwd5');

    function fmt(t) {
      if (isNaN(t) || !isFinite(t)) return '00:00';
      const m = Math.floor(t / 60), s = Math.floor(t % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }
    function updateClock() {
      clock.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration || 0)}`;
    }
    function updateSeekFromTime() {
      const d = audio.duration || 0;
      seek.value = d > 0 ? Math.round(audio.currentTime / d * 1000) : 0;
      updateClock();
    }
    function updateTimeFromSeek() {
      const d = audio.duration || 0;
      if (d > 0) audio.currentTime = (seek.value / 1000) * d;
    }
    btnPlay.addEventListener('click', () => {
      if (audio.paused) { audio.play(); btnPlay.textContent = '⏸︎ Pauza'; }
      else { audio.pause(); btnPlay.textContent = '▶︎ Přehrát'; }
    });
    btnStop.addEventListener('click', () => {
      audio.pause(); audio.currentTime = 0; btnPlay.textContent = '▶︎ Přehrát'; updateSeekFromTime();
    });
    back5.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
    fwd5.addEventListener('click', () => { if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); });
    seek.addEventListener('input', updateTimeFromSeek);
    audio.addEventListener('timeupdate', updateSeekFromTime);
    audio.addEventListener('loadedmetadata', updateSeekFromTime);
    audio.addEventListener('ended', () => { btnPlay.textContent = '▶︎ Přehrát'; });
    document.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
      if (e.key.toLowerCase() === 's') { e.preventDefault(); btnStop.click(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); back5.click(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); fwd5.click(); }
    });
  </script>
</body>
</html>
