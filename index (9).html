<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio přehrávač – MC Gey (MP3)</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa; --accent2:#1d4ed8; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
         background:radial-gradient(1200px 800px at 20% -10%, #1f2937 0%, var(--bg) 60%), var(--bg);
         color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial}
    .card{width:min(720px,96vw);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
          border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:clamp(20px,3vw,26px)}
    p.sub{margin:0 0 14px;color:var(--muted)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
           background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;cursor:pointer}
    button.secondary{background:#0b1220;color:var(--text)}
    input[type=range]{width:100%;height:6px;border-radius:999px;background:#0b1220;appearance:none;-webkit-appearance:none}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;
      background:var(--accent);border:1px solid rgba(255,255,255,.6)}
    .time{font-variant-numeric:tabular-nums;color:var(--muted);text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <h1>MC Gey – Osmimílový boty (MP3)</h1>
    <p class="sub">Mezerník = přehrát/pauza · S = stop · ←/→ = −/+5s</p>

    <!-- 1) AUDIO se 2 zdroji: (A) URL‑enkódovaný název, (B) jednoduchý fallback song.mp3 -->
    <audio id="audio" preload="metadata">
      <source src="MC%20GEY%20-%20Osmim%C3%ADlov%C3%BD%20boty.mp3" type="audio/mpeg" />
      <source src="song.mp3" type="audio/mpeg" />
      Váš prohlížeč nepodporuje HTML5 audio.
    </audio>

    <div class="row" style="margin-top:12px;">
      <button id="play">▶︎ Přehrát</button>
      <button id="stop" class="secondary">⏹︎ Stop</button>
      <button id="back5" class="secondary">⟲ 5s</button>
      <button id="fwd5" class="secondary">5s ⟳</button>
    </div>

    <input id="seek" type="range" min="0" max="1000" value="0" step="1" style="margin:12px 0 8px;">
    <div class="time" id="clock">00:00 / 00:00</div>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('play');
    const btnStop = document.getElementById('stop');
    const seek = document.getElementById('seek');
    const clock = document.getElementById('clock');
    const back5 = document.getElementById('back5');
    const fwd5 = document.getElementById('fwd5');

    function fmt(t){ if(isNaN(t)||!isFinite(t)) return '00:00'; const m=Math.floor(t/60), s=Math.floor(t%60);
      return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
    function updateClock(){ clock.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration||0)}`; }
    function updateSeekFromTime(){ const d=audio.duration||0; seek.value = d>0 ? Math.round(audio.currentTime/d*1000) : 0; updateClock(); }
    function updateTimeFromSeek(){ const d=audio.duration||0; if(d>0) audio.currentTime = (seek.value/1000)*d; }

    btnPlay.addEventListener('click', ()=>{ if(audio.paused){ audio.play(); btnPlay.textContent='⏸︎ Pauza'; } else { audio.pause(); btnPlay.textContent='▶︎ Přehrát'; } });
    btnStop.addEventListener('click', ()=>{ audio.pause(); audio.currentTime=0; btnPlay.textContent='▶︎ Přehrát'; updateSeekFromTime(); });
    back5.addEventListener('click', ()=>{ audio.currentTime = Math.max(0, audio.currentTime-5); });
    fwd5.addEventListener('click', ()=>{ if(audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime+5); });

    seek.addEventListener('input', updateTimeFromSeek);
    audio.addEventListener('timeupdate', updateSeekFromTime);
    audio.addEventListener('loadedmetadata', updateSeekFromTime);
    audio.addEventListener('ended', ()=>{ btnPlay.textContent='▶︎ Přehrát'; });

    document.addEventListener('keydown',(e)=>{
      if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if(e.code==='Space'){ e.preventDefault(); btnPlay.click(); }
      if(e.key.toLowerCase()==='s'){ e.preventDefault(); btnStop.click(); }
      if(e.key==='ArrowLeft'){ e.preventDefault(); back5.click(); }
      if(e.key==='ArrowRight'){ e.preventDefault(); fwd5.click(); }
    });
  </script>
</body>
</html>
