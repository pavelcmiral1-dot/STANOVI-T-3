<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přehrávač – MC Gey: Osmimílový boty</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
      --accent:#60a5fa; --accent-2:#1d4ed8; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(1200px 800px at 20% -10%, #1f2937 0%, var(--bg) 60%), var(--bg);
         color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial}
    .wrap{max-width:1000px;margin:auto;padding:24px;display:grid;gap:16px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);
          border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
    h1{font-size:clamp(20px,2.8vw,28px);margin:0}
    p.sub{margin:0;color:var(--muted)}
    video{width:100%;border-radius:12px;background:#000;display:block}
    .controls{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;margin-top:10px}
    button, input[type=range], select{
      appearance:none;-webkit-appearance:none;
    }
    button{
      background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;border:1px solid rgba(255,255,255,.18);
      border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer
    }
    button.secondary{background:linear-gradient(180deg,#0b1220,#0a1020);color:var(--text)}
    .time{font-variant-numeric:tabular-nums;min-width:88px;text-align:center;color:var(--muted)}
    input[type=range]{height:6px;border-radius:999px;background:#0b1220;outline:none}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:1px solid rgba(255,255,255,.6)}
    .bar{display:grid;gap:8px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .hint{color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Přehrávač – MC Gey: Osmimílový boty</h1>
      <p class="sub">Ovládání: mezerník = přehrát/pozastavit · S = stop · ←/→ = posun −/+5s</p>
      <video id="player" preload="metadata">
        <source src="MC GEY - Osmimílový boty 720p.mp4" type="video/mp4" />
        Váš prohlížeč nepodporuje HTML5 video.
      </video>

      <div class="controls">
        <div class="row">
          <button id="play">▶︎ Přehrát</button>
          <button class="secondary" id="stop">⏹︎ Stop</button>
        </div>

        <div class="bar">
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posun v čase">
        </div>

        <div class="time" id="clock">00:00 / 00:00</div>

        <div class="row">
          <button class="secondary" id="back5">⟲ 5s</button>
          <button class="secondary" id="fwd5">5s ⟳</button>
        </div>

        <div class="row">
          <select id="rate" aria-label="Rychlost přehrávání">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <span class="hint">rychlost</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (s)=>document.querySelector(s);
    const video = $('#player');
    const btnPlay = $('#play');
    const btnStop = $('#stop');
    const seek = $('#seek');
    const clock = $('#clock');
    const back5 = $('#back5');
    const fwd5 = $('#fwd5');
    const rate = $('#rate');

    function fmt(t){
      if (isNaN(t) || !isFinite(t)) return '00:00';
      const m = Math.floor(t/60), s = Math.floor(t%60);
      return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }

    function updateClock(){
      clock.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration||0)}`;
    }

    function updateSeekFromTime(){
      const d = video.duration || 0;
      if (d>0){
        seek.value = Math.round(video.currentTime / d * 1000);
      } else {
        seek.value = 0;
      }
      updateClock();
    }

    function updateTimeFromSeek(){
      const d = video.duration || 0;
      if (d>0){
        const ratio = seek.value/1000;
        video.currentTime = ratio * d;
      }
    }

    btnPlay.addEventListener('click', ()=>{
      if (video.paused) { video.play(); btnPlay.textContent = '⏸︎ Pauza'; }
      else { video.pause(); btnPlay.textContent = '▶︎ Přehrát'; }
    });

    btnStop.addEventListener('click', ()=>{
      video.pause(); video.currentTime = 0; btnPlay.textContent = '▶︎ Přehrát'; updateSeekFromTime();
    });

    back5.addEventListener('click', ()=>{ video.currentTime = Math.max(0, video.currentTime - 5); });
    fwd5.addEventListener('click', ()=>{ if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 5); });

    rate.addEventListener('change', ()=>{ video.playbackRate = parseFloat(rate.value); });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e)=>{
      if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space'){ e.preventDefault(); btnPlay.click(); }
      if (e.key.toLowerCase() === 's'){ e.preventDefault(); btnStop.click(); }
      if (e.key === 'ArrowLeft'){ e.preventDefault(); back5.click(); }
      if (e.key === 'ArrowRight'){ e.preventDefault(); fwd5.click(); }
    });

    // Seek bar interactions
    seek.addEventListener('input', updateTimeFromSeek);
    video.addEventListener('timeupdate', updateSeekFromTime);
    video.addEventListener('loadedmetadata', updateSeekFromTime);
    video.addEventListener('ended', ()=>{ btnPlay.textContent = '▶︎ Přehrát'; });

    // If the file name contains spaces/diacritics, keeping it as-is works when both files are in the same folder.
    // If hosting on the web, consider renaming the file to something simple and update the <source> accordingly.
  </script>
</body>
</html>
